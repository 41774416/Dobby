name: Build Dobby‑Master Android
on:
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full source with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip cmake ninja-build wget unzip make

      - name: Download Linux NDK‑r27c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip android-ndk-r27c-linux.zip -d ${{github.workspace}}
          echo "ANDROID_NDK_DIR=${{github.workspace}}/android-ndk-r27c" >> $GITHUB_ENV

      - name: Run official platform_builder.py compile Android all arch
        run: |
          cd ${{github.workspace}}
          ls -la
          python3 scripts/platform_builder.py \
          --platform=android \
          --arch=all \
          --android_ndk_dir=${{env.ANDROID_NDK_DIR}}

      - name: Upload compiled libdobby artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dobby‑android‑build
          path: |
            workspace/Dobby/build/android/**/*.a
            workspace/Dobby/build/android/**/*.so
