name: Build Dobby Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip cmake wget unzip

      - name: run setup script
        run: sh scripts/setup_linux_cross_compile.sh

      - name: compile android arm64-v8a
        run: |
          python3 scripts/platform_builder.py \
          --platform=android \
          --arch=arm64-v8a

      - name: upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android-arm64v8a
          path: |
            build/android/arm64-v8a/libdobby.a
            include/dobby.h
          retention-days: 30
